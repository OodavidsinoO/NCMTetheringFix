name: build

# Build on every push and PR so breakage surfaces before a tag exists, and
# publish a GitHub Release when a v* tag is pushed. The release job downloads the
# artefact the build job produced, so the published zip is byte-identical to the
# one that was verified (the packaging task is reproducible by construction).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; only the release job opts into contents:write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Packaging is plain Gradle now (no AGP), but pin the JDK so the build
      # does not drift with the runner image.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The default "enhanced" provider is a proprietary component; "basic"
          # keeps this workflow on stock, MIT-licensed tooling.
          cache-provider: basic

      - name: Build module zip
        run: ./gradlew packageModule

      - name: Checksum
        run: |
          cd build
          sha256sum ncm-tethering-fix-*.zip | tee SHA256SUMS.txt

      - name: Check shell syntax
        run: |
          for script in module/*.sh; do
            sh -n "$script"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: module-zip
          path: |
            build/ncm-tethering-fix-*.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: module-zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes "KernelSU/Magisk module for $TAG. Verify the download against SHA256SUMS.txt." \
            ncm-tethering-fix-*.zip SHA256SUMS.txt
